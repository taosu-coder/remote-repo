<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: red;
            transition: all 2s;
            margin: 100px auto;
        }

        div:hover {
            transform: translate(-100px, 100px)
        }

        /* 单独在x轴平移：transform: translateX（）
        单独在y轴平移：transform: translateY（） */
    </style>
</head>

<body>
    <div></div>
</body>

</html>
