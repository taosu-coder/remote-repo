<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            width: 300px;
            height: 300px;
            border: 1px solid black;
            background-color: red;
            margin: 50px auto;
            font-size: 50px;
            line-height: 300px;
            text-align: center;
            transform: skewX(30deg);
        }

        .box2 {
            width: 300px;
            height: 300px;
            border: 1px solid black;
            background-color: red;
            margin: 50px auto;
            font-size: 50px;
            line-height: 300px;
            text-align: center;
            transform: skewY(-30deg);
        }

        .box3 {
            width: 300px;
            height: 300px;
            border: 1px solid black;
            background-color: red;
            margin: 50px auto;
            font-size: 50px;
            line-height: 300px;
            text-align: center;
            transform: skew(30deg, 30deg);
        }
    </style>
</head>

<body>
    <div class="box1">你好</div>
    <div class="box2">你好</div>
    <div class="box3">你好</div>
</body>

</html>
