<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        .swiper-container {
            width: 640px;
            height: 400px;
            margin: 0 auto;
            overflow: hidden;
        }

        .swiper-wrapper {
            width: 9999px;
            animation: run 10s linear infinite;
        }

        .swiper-slide img {
            width: 640px;
            height: 400px;
        }

        .swiper-slide {
            float: left;
        }

        .swiper-wrapper:hover {
            animation-play-state: paused;
        }

        @keyframes run {
            0% {
                transform: translatex(0);
            }

            5% {
                transform: translatex(-640px);
            }

            25% {
                transform: translatex(-640px);
            }

            30% {
                transform: translatex(-1280px);
            }

            50% {
                transform: translatex(-1280px);
            }

            55% {
                transform: translatex(-1920px);
            }

            75% {
                transform: translatex(-1920px);
            }

            80% {
                transform: translatex(-2560px);
            }

            100% {
                transform: translatex(-2560px);
            }
        }
    </style>
</head>

<body>
    <div class="swiper-container">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="abcimg/168 (1).jpg" alt="">
            </div>
            <div class="swiper-slide">
                <img src="abcimg/168 (2).jpg" alt="">
            </div>
            <div class="swiper-slide">
                <img src="abcimg/168 (3).jpg" alt="">
            </div>
            <div class="swiper-slide">
                <img src="abcimg/168 (4).jpg" alt="">
            </div>
            <div class="swiper-slide">
                <img src="abcimg/168 (1).jpg" alt="">
                <div>
                </div>
            </div>
        </div>
</body>

</html>
