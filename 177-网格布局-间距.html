<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 600px;
            height: 600px;
            border: 3px solid gray;
            display: grid;
            grid-template-rows: 33.33% 33.33% 33.33%;
            grid-template-columns: 33.33% 33.33% 33.33%;
            /* row-gap: 30px;
            column-gap: 30px; */
            gap: 30px 30px;
        }

        .box div {
            border: 1px dashed red;
        }
    </style>
</head>

<body>
    <div class="box">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>
</body>

</html>
