<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 400px;
            height: 400px;
            border: 3px solid gray;
            transform-style: preserve-3d;
            display: flex;
            perspective: 900px;
            transform: rotateX(10deg)
                /* 可以网页旋转看效果，在网页上的10deg轮盘 */
        }

        .center {
            width: 200px;
            height: 200px;
            background: red;
            margin: auto;
            transform: rotate3d(1, 1, 1, 30deg);
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="center"></div>
    </div>
</body>

</html>
