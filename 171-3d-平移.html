<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 400px;
            height: 400px;
            border: 3px solid gray;
            transform-style: preserve-3d;
            position: relative;
            perspective: 900px;
            /* 景深 */
        }

        .center {
            width: 200px;
            height: 200px;
            background: red;
            position: absolute;
            left: 50%;
            top: 50%;
            margin-left: -100px;
            margin-top: -100px;
            transform: translateZ(100px);
            /* z轴，即靠近人眼100px */
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="center"></div>
    </div>
</body>

</html>
