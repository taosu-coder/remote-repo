<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        img {
            display: block;
        }

        .box1 {
            width: 350px;
            height: 400px;
            border: 5px solid gray;
            margin: 10px auto;
            position: relative;
            color: white;
            overflow: hidden;
        }

        .box1 img {
            width: 100%;
            transition: all 1s;
        }

        .box1:hover img {
            transform: translatex(50px);
            opacity: 0.7;
        }

        .box1 p {
            width: 100px;
            height: 30px;
            background: blue;
            line-height: 30px;
            text-align: center;
            transition: all 0.5s;
        }

        .box1 h2 {
            position: absolute;
            top: 20px;
            left: 30px;
            transition: all 1s ease 0.5s;
        }

        .box1:hover h2 {
            transform: translate(40px);
        }

        .box1 .p1 {
            position: absolute;
            top: 100px;
            left: 10px;
            transform: translatey(400px);
        }

        .box1:hover .p1 {
            transform: translate(0px);
        }

        .box1 .p2 {
            position: absolute;
            top: 200px;
            left: 10px;
            transform: translatex(400px);
        }

        .box1:hover .p2 {
            transform: translate(0px);
        }

        .box1 .p3 {
            position: absolute;
            top: 300px;
            left: 10px;
            transform: translatex(-200px);
        }

        .box1:hover .p3 {
            transform: translate(0px);
        }
    </style>
</head>

<body>
    <div class="box1">
        <img src="abcimg/1989 Polaroid/1.png" alt="">
        <h2>Billboard三首排行第一</h2>
        <p class="p1">shake it off</p>
        <p class="p2">black space</p>
        <p class="p3">bad blood</p>
    </div>
</body>

</html>
