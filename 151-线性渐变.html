<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            width: 300px;
            height: 300px;
            border: 2px solid gray;
            background: linear-gradient(red, yellow, green);
        }

        .box2 {
            width: 300px;
            height: 300px;
            border: 2px solid gray;
            background: linear-gradient(50deg, red, yellow, green);
        }

        .box3 {
            width: 300px;
            height: 300px;
            border: 2px solid gray;
            background: linear-gradient(to top right, red, yellow, green);
        }
    </style>
</head>

<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>

</html>
